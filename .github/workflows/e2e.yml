name: browser

on:
  push:
  pull_request:
  schedule:
    - cron: "17 7 * * *"   # nightly, so a broken page shows up even without a push

# Read-only token: these jobs only check out and test the code.
permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.47.2
          npx playwright install --with-deps chromium
      - name: Start a server on a fresh data directory
        # The steps are written against the Hartline Remodeling data (seed.py), not the live
        # demo; a second server has the live demo (Redbud Electric, demo_seed.py) for 86-demo.mjs.
        run: |
          DURACASH_DEMO_SEED=hartline DURACASH_DATA_DIR="$RUNNER_TEMP/data" BACKUP_HOURS=0 HOST=127.0.0.1 PORT=8765 python3 server.py > "$RUNNER_TEMP/server.log" 2>&1 &
          mkdir -p "$RUNNER_TEMP/demo-data"
          DURACASH_DATA_DIR="$RUNNER_TEMP/demo-data" BACKUP_HOURS=0 HOST=127.0.0.1 PORT=8766 python3 server.py > "$RUNNER_TEMP/demo-server.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8765/healthz > /dev/null && curl -sf http://127.0.0.1:8766/healthz > /dev/null && break; sleep 1; done
      - name: Browser smoke test
        run: DURACASH_URL_UNDER_TEST=http://127.0.0.1:8765 DURACASH_DEMO_URL_UNDER_TEST=http://127.0.0.1:8766 node tests/e2e/smoke.mjs
      - name: Server log
        if: always()
        run: tail -n 80 "$RUNNER_TEMP/server.log" "$RUNNER_TEMP/demo-server.log"
