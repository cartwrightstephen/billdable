name: tests

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit and HTTP tests
        run: python3 -m unittest discover -s tests -v
      - name: Same tests on the JSON storage layout
        run: python3 -m unittest discover -s tests
        env:
          DURACASH_STORAGE: json
