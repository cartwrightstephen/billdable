name: tests

on:
  push:
  pull_request:

# The suite is large (a few thousand tests), so the two storage layouts run as separate jobs,
# side by side, and each has room to finish.
# Read-only token: these jobs only check out and test the code.
permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Every Python file compiles
        run: python3 -m compileall -q .
      - name: Unit and HTTP tests
        run: python3 -m unittest discover -s tests -v
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - name: Client helper tests (no browser)
        run: node --test tests/js

  unittest-json:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Same tests on the JSON storage layout
        run: python3 -m unittest discover -s tests
        env:
          DURACASH_STORAGE: json
