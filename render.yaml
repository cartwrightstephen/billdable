services:
  # Production: deploys main.
  - type: web
    # Renamed from billdable on 2026-10-27. On an account that still has the old services, rename
    # them and the disk in the Render dashboard first, or Render creates new, empty ones.
    name: duracash
    # Docker, so the image has the age program that encrypts off-site backups (offsite.py).
    runtime: docker
    dockerfilePath: ./Dockerfile
    # A persistent disk needs a paid instance; on the free plan every deploy erases all data.
    plan: starter
    branch: main
    healthCheckPath: /healthz
    disk:
      name: duracash-data
      mountPath: /var/data
      # Room for the uploads and 14 local backups of them (R6-06); /healthz answers 503 under 200 MB free.
      sizeGB: 10
    envVars:
      - key: DURACASH_DATA_DIR
        value: /var/data
      # Production refuses to start without the settings below and turns the demo account off.
      - key: DURACASH_ENV
        value: production
      - key: COOKIE_SECURE
        value: "1"
      # The site's https:// address; set it in the Render dashboard.
      - key: DURACASH_URL
        sync: false
      # Set to 1 only after a deploy has been seen to keep accounts and data.
      - key: DURACASH_DATA_PERSISTENT
        sync: false

  # Staging (P1-13): deploys dev, so a change is tried on a real server before main.
  # Free plan, no disk: its data is throwaway and the landing page says so.
  # Email and text tests run here (Decision 8). DURACASH_ENV=staging means only the people on
  # MAIL_ALLOWLIST and SMS_ALLOWLIST get anything, and nobody when a list is blank. Without
  # SMTP_HOST it sends no email at all, and the Outbox shows what it would have sent.
  # Fill the sync: false values in the Render dashboard: docs/setup-integrations.md.
  - type: web
    name: duracash-staging
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    branch: dev
    healthCheckPath: /healthz
    envVars:
      - key: DURACASH_ENV
        value: staging
      - key: COOKIE_SECURE
        value: "1"
      - key: DURACASH_URL
        sync: false
      - key: MAIL_ALLOWLIST
        sync: false
      - key: SMS_ALLOWLIST
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_NUMBER
        sync: false
      - key: QBO_CLIENT_ID
        sync: false
      - key: QBO_CLIENT_SECRET
        sync: false
      - key: QBO_ENV
        sync: false
