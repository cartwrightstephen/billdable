services:
  # Production: deploys main.
  - type: web
    # The services and disk keep their Billdable-era names: renaming them makes Render create new ones.
    name: billdable
    # Docker, so the image has the age program that encrypts off-site backups (offsite.py).
    runtime: docker
    dockerfilePath: ./Dockerfile
    # A persistent disk needs a paid instance; on the free plan every deploy erases all data.
    plan: starter
    branch: main
    healthCheckPath: /healthz
    disk:
      name: billdable-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DURACASH_DATA_DIR
        value: /var/data
      # Production refuses to start without the settings below and turns the demo account off.
      - key: DURACASH_ENV
        value: production
      - key: COOKIE_SECURE
        value: "1"
      # The site's https:// address; set it in the Render dashboard.
      - key: DURACASH_URL
        sync: false
      # Set to 1 only after a deploy has been seen to keep accounts and data.
      - key: DURACASH_DATA_PERSISTENT
        sync: false

  # Staging (P1-13): deploys dev, so a change is tried on a real server before main.
  # Free plan, no disk: its data is throwaway and the landing page says so. No mail
  # settings, so it never emails anyone; the Outbox shows what it would have sent.
  - type: web
    name: billdable-staging
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    branch: dev
    healthCheckPath: /healthz
    envVars:
      - key: COOKIE_SECURE
        value: "1"
