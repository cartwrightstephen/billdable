<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Billdable</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div id="app"></div>
<button class="ai-badge" id="ai-badge" title="Quick answers (rule-based)">✦</button>
<div class="ai-panel" id="ai-panel">
  <h3>Quick answers</h3>
  <p class="sub">Rule-based answers from your own data: blockers, money totals, a follow-up note. No AI and no outside service.</p>
  <div id="ai-replies"></div>
  <input type="text" id="ai-input" placeholder="e.g. What’s blocking Oak Street?" />
</div>
<script src="/app.js"></script>
</body>
</html>
