<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Billdable</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div id="app"></div>
<button class="ai-badge" id="ai-badge" title="Talk to Billdable">✦</button>
<div class="ai-panel" id="ai-panel">
  <h3>Talk to Billdable</h3>
  <p class="sub">Ask about a job, blockers, or draft a follow-up note. (Local rules — no external API.)</p>
  <div id="ai-replies"></div>
  <input type="text" id="ai-input" placeholder="e.g. What’s blocking Oak Street?" />
</div>
<script src="/app.js"></script>
</body>
</html>
